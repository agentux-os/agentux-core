name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.arch }})
    # aarch64 too, natively, since release.yml ships an aarch64 RPM.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The real-harness run's plumbing, with scripted agents (no credentials):
      # tests/e2e/run-real.sh, as .github/workflows/real-harnesses.yml runs it.
      - name: Real-harness run, scripted
        run: |
          cargo build --locked --bin aux --bin agentuxd
          git config --global user.name ci
          git config --global user.email ci@agentuxos.org
          AGENTUX_E2E_FAKE=1 sh tests/e2e/run-real.sh claude-code "$PWD/target/debug"
        env:
          # The container-isolation tests skip without podman; the runner
          # has it, so a skip here would hide a regression.
          AGENTUX_REQUIRE_PODMAN: "1"

  deny:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Advisories (RustSec), licenses, banned and unknown sources: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
