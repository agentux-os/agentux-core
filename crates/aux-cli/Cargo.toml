[package]
name = "aux-cli"
description = "aux, the AgentUX command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aux"
path = "src/main.rs"

[dependencies]
agentux-api.workspace = true
agentux-bus.workspace = true
agentux-config.workspace = true
agentux-harness.workspace = true
agentux-worktree.workspace = true
agentuxd.workspace = true
clap.workspace = true
crossterm.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
agentux-fake-agent.workspace = true
agentux-store.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
