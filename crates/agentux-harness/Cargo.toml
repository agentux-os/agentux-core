[package]
name = "agentux-harness"
description = "Drives coding-agent harnesses through the Agent Client Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
