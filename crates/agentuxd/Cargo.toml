[package]
name = "agentuxd"
description = "The AgentUX daemon: runs pipelines and serves the local API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agentux-api.workspace = true
agentux-bus.workspace = true
agentux-config.workspace = true
agentux-harness.workspace = true
agentux-store.workspace = true
agentux-worktree.workspace = true
clap.workspace = true
portable-pty.workspace = true
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
agentux-fake-agent.workspace = true
tempfile.workspace = true

[lints]
workspace = true
