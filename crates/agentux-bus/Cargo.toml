[package]
name = "agentux-bus"
description = "The AgentUX agent bus: mediated messaging between harness sessions, served over MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agentux-config.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
