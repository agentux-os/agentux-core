[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentux-os/agentux-core"
publish = false

[workspace.dependencies]
agentux-config = { path = "crates/agentux-config" }
agentux-worktree = { path = "crates/agentux-worktree" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
