[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentux-os/agentux-core"
publish = false

[workspace.dependencies]
agentux-api = { path = "crates/agentux-api" }
agentux-bus = { path = "crates/agentux-bus" }
agentux-config = { path = "crates/agentux-config" }
agentux-fake-agent = { path = "crates/agentux-fake-agent" }
agentux-gateway = { path = "crates/agentux-gateway" }
agentux-harness = { path = "crates/agentux-harness" }
agentux-store = { path = "crates/agentux-store" }
agentux-worktree = { path = "crates/agentux-worktree" }
agentuxd = { path = "crates/agentuxd" }
agent-client-protocol = "2.2"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
# AUXP, shared with agentux-command and tested against the protocol's schemas.
auxp = { git = "https://github.com/agentux-os/agentux-protocol", rev = "9c219eebb88b1bd74a275f8a17ba287031723d3c" }
jiff = "0.2"
portable-pty = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sigpipe = "0.1"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
tempfile = "3.27"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
