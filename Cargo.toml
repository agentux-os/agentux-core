[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentux-os/agentux-core"
publish = false

[workspace.dependencies]
agentux-api = { path = "crates/agentux-api" }
agentux-config = { path = "crates/agentux-config" }
agentux-harness = { path = "crates/agentux-harness" }
agentux-store = { path = "crates/agentux-store" }
agentux-worktree = { path = "crates/agentux-worktree" }
agentuxd = { path = "crates/agentuxd" }
agent-client-protocol = "2.2"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tempfile = "3.27"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
